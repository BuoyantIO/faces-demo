{{- if not .Values.adminOnly }}
{{- include "partials.backend"
    (dict "name" "color"
          "workload" "color"
          "portname" "http2"
          "root" .) }}
{{- if .Values.color.enabled }}
---
# Headless service for per-pod targeting from faces-admin (gRPC port 8000 only —
# chaos is now a gRPC method, no separate HTTP sidecar port needed)
apiVersion: v1
kind: Service
metadata:
  name: color-headless
  namespace: {{ .Release.Namespace }}
  labels:
    buoyant.io/application: faces
    faces.buoyant.io/component: color
spec:
  clusterIP: None
  selector:
    buoyant.io/application: faces
    faces.buoyant.io/component: color
  ports:
  - port: 8000
    name: http2
    targetPort: http2
{{- end }}
{{- include "partials.backend"
    (dict "name" "color2"
          "workload" "color"
          "portname" "http2"
          "root" .) }}
{{- include "partials.backend"
    (dict "name" "color3"
          "workload" "color"
          "portname" "http2"
          "root" .) }}
{{- end }}
