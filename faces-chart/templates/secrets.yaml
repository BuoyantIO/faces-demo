{{- if not .Values.adminOnly }}
{{- if and .Values.facesAdmin.enabled ((.Values.facesAdmin.auth).createSecret) }}
---
# WARNING: only appropriate for local/demo use.
# For production, set facesAdmin.auth.createSecret=false and provision
# faces-admin-auth-secret via your secret management system.
apiVersion: v1
kind: Secret
metadata:
  name: faces-admin-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    buoyant.io/application: faces
type: Opaque
stringData:
  username: {{ .Values.facesAdmin.auth.username | default "faces-admin" | quote }}
  password: {{ .Values.facesAdmin.auth.password | required "facesAdmin.auth.password is required when facesAdmin.auth.createSecret=true" | quote }}
{{- end }}
{{- if eq (.Values.faceMode | default "classic") "pubsub" -}}
{{- if .Values.mysql.createSecret }}
---
# WARNING: only appropriate for local/demo use.
# For shared or production environments set mysql.createSecret=false and
# provision faces-mysql-secret via your secret management system.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.passwordSecret | default "faces-mysql-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    buoyant.io/application: faces
type: Opaque
stringData:
  password: {{ .Values.mysql.password | required "mysql.password is required when mysql.createSecret=true" | quote }}
  rootPassword: {{ .Values.mysql.rootPassword | required "mysql.rootPassword is required when mysql.createSecret=true" | quote }}
{{- end }}
{{- if and .Values.redis.createSecret .Values.redis.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.passwordSecret | default "faces-redis-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    buoyant.io/application: faces
type: Opaque
stringData:
  password: {{ .Values.redis.password | quote }}
{{- end }}
{{- $rmq := .Values.rabbitmq | default dict -}}
{{- if eq (.Values.queueBackend | default "rabbitmq") "rabbitmq" }}
---
# WARNING: only appropriate for local/demo use.
# For shared or production environments set rabbitmq.createSecret=false and
# provision faces-rabbitmq-secret via your secret management system.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rmq.passwordSecret | default "faces-rabbitmq-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    buoyant.io/application: faces
type: Opaque
stringData:
  password: {{ $rmq.password | default "faces-password" | quote }}
{{- end }}
{{- end }}
{{- end }}
