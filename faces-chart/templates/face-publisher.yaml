        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $rmq.passwordSecret | default "faces-rabbitmq-secret" }}
              key: password
        - name: RABBITMQ_VHOST
          value: {{ $rmq.vhost | default "/" | quote }}
        - name: RABBITMQ_QUEUE
