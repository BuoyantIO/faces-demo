        - name: DB_MAX_OPEN
          value: {{ .Values.mysql.maxOpen | default 10 | quote }}
        - name: DB_MAX_IDLE
          value: {{ .Values.mysql.maxIdle | default 5 | quote }}
        - name: DB_RETENTION_H
          value: {{ .Values.mysql.retentionHours | default 24 | quote }}
        - name: QUEUE_BACKEND
          value: {{ .Values.queueBackend | default "rabbitmq" | quote }}
        {{- if eq (.Values.queueBackend | default "rabbitmq") "rabbitmq" }}
        - name: RABBITMQ_HOST
          value: {{ $rmq.host | default "rabbitmq" | quote }}
        - name: RABBITMQ_PORT
          value: {{ $rmq.port | default 5672 | quote }}
        - name: RABBITMQ_USER
