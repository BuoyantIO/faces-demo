      {{- end }}
      containers:
      - name: face-publisher
        image: {{ if .Values.facePublisher.image }}{{ .Values.facePublisher.image }}{{ else }}{{ .Values.facePublisher.imageName }}:{{ .Values.facePublisher.imageTag | default .Chart.AppVersion }}{{ end }}
