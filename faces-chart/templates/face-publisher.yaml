        - name: QUEUE_FILL_THRESHOLD
          value: {{ .Values.facePublisher.queueFillThreshold | default 0.75 | quote }}
        - name: QUEUE_MONITOR_INTERVAL_S
          value: {{ .Values.facePublisher.queueMonitorIntervalS | default 30 | quote }}
        - name: ERROR_FRACTION
