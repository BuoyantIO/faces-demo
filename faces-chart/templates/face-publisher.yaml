        - name: RABBITMQ_MAX_QUEUE_DEPTH
          value: {{ $rmq.maxQueueDepth | default 5000 | quote }}
        {{- else }}
        - name: REDIS_ADDRESS
          value: {{ .Values.redis.address | default "redis:6379" | quote }}
        - name: REDIS_QUEUE_KEY
