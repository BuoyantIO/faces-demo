kind: Deployment
metadata:
  name: face-subscriber
  namespace: {{ .Release.Namespace }}
  labels:
    buoyant.io/application: faces
    faces.buoyant.io/component-type: edge
    faces.buoyant.io/component: face-subscriber
spec:
  replicas: {{ .Values.faceSubscriber.replicas | default 1 }}
  selector:
    matchLabels:
      buoyant.io/application: faces
      faces.buoyant.io/component: face-subscriber
  template:
    metadata:
      labels:
        buoyant.io/application: faces
        faces.buoyant.io/component-type: edge
        faces.buoyant.io/component: face-subscriber
    spec:
      initContainers:
      - name: wait-for-mysql
