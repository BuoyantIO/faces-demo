      {{- end }}
      containers:
      - name: face-subscriber
        image: {{ if .Values.faceSubscriber.image }}{{ .Values.faceSubscriber.image }}{{ else }}{{ .Values.faceSubscriber.imageName }}:{{ .Values.faceSubscriber.imageTag | default .Chart.AppVersion }}{{ end }}
        imagePullPolicy: {{ .Values.faceSubscriber.imagePullPolicy | default .Values.defaultImagePullPolicy }}
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: USER_HEADER_NAME
          value: {{ .Values.authHeader | quote }}
        - name: ERROR_FRACTION
          value: {{ .Values.faceSubscriber.errorFraction | default "0" | quote }}
        {{- if .Values.faceSubscriber.delayBuckets }}
        - name: DELAY_BUCKETS
          value: {{ .Values.faceSubscriber.delayBuckets | quote }}
        {{- end }}
        - name: WAIT_ON_EMPTY
          value: {{ .Values.faceSubscriber.waitOnEmpty | default false | quote }}
        - name: WAIT_TIMEOUT_S
          value: {{ .Values.faceSubscriber.waitTimeoutS | default 5 | quote }}
        - name: DB_HOST
          value: {{ .Values.mysql.host | default "mysql" | quote }}
        - name: DB_PORT
          value: {{ .Values.mysql.port | default 3306 | quote }}
        - name: DB_NAME
          value: {{ .Values.mysql.database | default "faces" | quote }}
        - name: DB_USER
          value: {{ .Values.mysql.user | default "faces" | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mysql.passwordSecret | default "faces-mysql-secret" }}
              key: password
        - name: DB_MAX_OPEN
          value: {{ .Values.mysql.maxOpen | default 10 | quote }}
        - name: DB_MAX_IDLE
          value: {{ .Values.mysql.maxIdle | default 5 | quote }}
        - name: QUEUE_BACKEND
          value: {{ .Values.queueBackend | default "rabbitmq" | quote }}
        {{- if eq (.Values.queueBackend | default "rabbitmq") "rabbitmq" }}
        - name: RABBITMQ_HOST
          value: {{ $rmq.host | default "rabbitmq" | quote }}
        - name: RABBITMQ_PORT
          value: {{ $rmq.port | default 5672 | quote }}
        - name: RABBITMQ_USER
          value: {{ $rmq.user | default "faces" | quote }}
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $rmq.passwordSecret | default "faces-rabbitmq-secret" }}
              key: password
        - name: RABBITMQ_VHOST
          value: {{ $rmq.vhost | default "/" | quote }}
        - name: RABBITMQ_QUEUE
          value: {{ $rmq.queueName | default "faces.queue" | quote }}
        - name: RABBITMQ_MAX_QUEUE_DEPTH
          value: {{ $rmq.maxQueueDepth | default 5000 | quote }}
        {{- else }}
        - name: REDIS_ADDRESS
          value: {{ .Values.redis.address | default "redis:6379" | quote }}
        - name: REDIS_QUEUE_KEY
          value: {{ .Values.redis.queueKey | default "faces:queue" | quote }}
        - name: REDIS_DB
          value: {{ .Values.redis.db | default 0 | quote }}
        - name: REDIS_MAX_QUEUE_DEPTH
          value: {{ .Values.redis.maxQueueDepth | default 5000 | quote }}
        {{- if .Values.redis.password }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.passwordSecret | default "faces-redis-secret" }}
              key: password
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
{{- end }}
{{- end }}
{{- end }}
