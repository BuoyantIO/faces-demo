  color: "darkblue"               # Override if desired, defaults to colorblind-friendly green from the Tol palette
  # image: ""                     # If set, overrides the imageName/imageTag pair
  imageName: ghcr.io/buoyantio/faces-color
  # imageTag: ""                  # If not set, uses backend.imageTag
  # imagePullPolicy: ""           # If not set, uses backend.imagePullPolicy
  # errorFraction: ""             # If not set, uses backend.errorFraction
  # delayBuckets: ""              # If not set, uses backend.delayBuckets

# --- Argo Rollouts switch & common options ---
rollouts:
  # when true, render Rollout instead of Deployment
  enabled: false

  # Choose one: "canary" or "blueGreen"
  strategy: canary

  # Common pod rollout knobs (work for both strategies)
  maxSurge: 1
  maxUnavailable: 0
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 0

  # Canary options
  canary:
    # If you do traffic shifting with Linkerd, Argo will manage a TrafficSplit.
    # If you don't want traffic shifting, leave trafficRouting null and it behaves like controlled rolling update.
    trafficRouting:
      # Option A: built-in provider (example: smi | nginx | alb | gateway | null). Leave null/empty if using plugin.
      provider: null

      # Option B: plugin-based traffic routing
      plugin:
        name: "argoproj-labs/gatewayAPI"             # e.g., "argoproj-labs/gatewayAPI"
        autocreateRoutes: true                       # if true, chart creates routes & fills plugin config automatically
        config: {}                                   # arbitrary key/values, e.g. { httpRoute: argo-rollouts-http-route, namespace: test }
    # Canary steps for each workload
    gui:
      steps:
        - setWeight: 10
        - pause: { duration: 10 }
        - setWeight: 20
        - pause: { duration: 10 }
        - setWeight: 50
        - pause: { duration: 10 }
        - setWeight: 70
        - pause: { duration: 60 }
        - setWeight: 100

    face:
      steps:
        - setWeight: 10
        - pause: { duration: 10 }
        - setWeight: 20
        - pause: { duration: 10 }
        - setWeight: 50
        - pause: { duration: 20 }
        - setWeight: 70
        - pause: { duration: 60 }
        - setWeight: 100

    smiley:
      steps:
        - setWeight: 10
        - pause: { duration: 10 }
        - setWeight: 20
        - pause: { duration: 10 }
        - setWeight: 50
        - pause: { duration: 10 }
        - setWeight: 70
        - pause: { duration: 10 }
        - setWeight: 100

    smiley2:
      steps:
        - setWeight: 10
        - pause: { duration: 20 }
        - setWeight: 20
        - pause: { duration: 20 }
        - setWeight: 50
        - pause: { duration: 20 }
        - setWeight: 70
        - pause: { duration: 20 }
        - setWeight: 100

    smiley3:
      steps:
        - setWeight: 10
        - pause: { duration: 30 }
        - setWeight: 20
        - pause: { duration: 30 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 70
        - pause: { duration: 60 }
        - setWeight: 100

    color:
      steps:
        - setWeight: 10
        - pause: { duration: 10 }
        - setWeight: 20
        - pause: { duration: 10 }
        - setWeight: 50
        - pause: { duration: 10 }
        - setWeight: 70
        - pause: { duration: 60 }
        - setWeight: 100

    color2:
      steps:
        - setWeight: 10
        - pause: { duration: 20 }
        - setWeight: 20
        - pause: { duration: 20 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 70
