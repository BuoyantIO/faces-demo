        - setWeight: 100

    color3:
      steps:
        - setWeight: 10
        - pause: { duration: 30 }
        - setWeight: 20
        - pause: { duration: 30 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 70
        - pause: { duration: 60 }
        - setWeight: 100
    facePublisher:
      steps:
