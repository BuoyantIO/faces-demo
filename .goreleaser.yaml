version: 2

# Allow overriding the registry and image name with environment variables.
env:
  - REGISTRY={{ if index .Env "REGISTRY"  }}{{ .Env.REGISTRY }}{{ else }}ghcr.io/buoyantio{{ end }}
  - IMAGE_NAME={{ if index .Env "IMAGE_NAME"  }}{{ .Env.IMAGE_NAME }}{{ else }}faces{{ end }}
  - EXTERNAL_BASE={{ if index .Env "EXTERNAL_BASE"  }}{{ .Env.EXTERNAL_BASE }}{{ else }}ghcr.io/buoyantio/demo-external-base:0.3.0{{ end }}
  - BEL_EXTERNAL_BASE={{ if index .Env "BEL_EXTERNAL_BASE"  }}{{ .Env.BEL_EXTERNAL_BASE }}{{ else }}ghcr.io/buoyantio/demo-bel-external-base:0.3.0{{ end }}

before:
  hooks:
    - go mod tidy
    # Make the chart as part of the build process.
    - make VERSION={{ .Version }} chart

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

archives:
- allow_different_binary_count: true
  builds:
  - generic-color-linux
  - generic-face-linux
  - generic-gui-linux
  - generic-load-linux
  - generic-smiley-linux
  files:
  - none*
  id: generic-linux
  name_template: '{{ .ProjectName }}_generic_{{ .Version }}_linux_{{ .Arch }}{{ with
    .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64
    "v1") }}{{ .Amd64 }}{{ end }}'
- allow_different_binary_count: true
  builds:
  - generic-color-windows
  - generic-face-windows
  - generic-gui-windows
  - generic-load-windows
  - generic-smiley-windows
  files:
  - none*
  format: zip
  id: generic-windows
  name_template: '{{ .ProjectName }}_generic_{{ .Version }}_windows_{{ .Arch }}{{
    with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64
    "v1") }}{{ .Amd64 }}{{ end }}'
- allow_different_binary_count: true
  builds:
  - pi-color-linux
  - pi-smiley-linux
  files:
  - none*
  id: pi-linux
  name_template: '{{ .ProjectName }}_pi_{{ .Version }}_linux_{{ .Arch }}{{ with .Arm
    }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1")
    }}{{ .Amd64 }}{{ end }}'
builds:
- binary: gui-workload
  env:
  - CGO_ENABLED=0
  goarch:
  - arm64
  - amd64
  goos:
  - linux
  id: generic-gui-linux
  main: ./cmd/generic/gui
- binary: gui-workload
  env:
  - CGO_ENABLED=0
  goarch:
  - arm64
  - amd64
  goos:
  - windows
  id: generic-gui-windows
  main: ./cmd/generic/gui
- binary: load-workload
